name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK with Docker
        run: |
          rm -rf .buildozer bin

          docker pull kivy/buildozer:latest

          docker run --rm \
            --volume "$PWD":/home/user/hostcwd \
            --entrypoint /bin/bash \
            kivy/buildozer:latest \
            -lc 'cd /home/user/hostcwd && \
                 python3 -m pip install "Cython<3" && \
                 buildozer -v android debug 2>&1 | tee build.log'

      - name: Check APK
        if: always()
        run: |
          echo "===== APK FILES ====="
          find bin -maxdepth 1 -type f -name "*.apk" -print 2>/dev/null || true

          echo "===== BUILD ERRORS ====="
          if [ -f build.log ]; then
            grep -inE "error:|fatal:|failed|exception" build.log | tail -n 50 || true
            echo "===== LAST 50 LINES ====="
            tail -n 50 build.log
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nikkei-leverage-analyzer-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

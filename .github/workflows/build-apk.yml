name: Build Android APK - Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK with Docker
        run: |
          docker pull kivy/buildozer:latest
          docker run --rm \
            --volume "$PWD":/home/user/hostcwd \
            kivy/buildozer:latest \
            android debug

      - name: Check APK
        if: always()
        run: |
          echo "===== APK FILES ====="
          find bin -maxdepth 1 -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nikkei-leverage-analyzer-apk
          path: bin/*.apk
          if-no-files-found: error
